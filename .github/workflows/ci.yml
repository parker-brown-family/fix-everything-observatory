name: ci
on:
  push:
  pull_request:

# The token this workflow is handed is the token anything it runs could use.
# Nothing here writes: it clones, installs three packages and runs the gate.
# Saying so explicitly is what stops a step added later — or a dependency of one
# — from inheriting write access to this repository by default.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # PINNED TO A COMMIT, NOT A TAG. A tag is a pointer its owner can move, so
      # `@v5` means "whatever actions/checkout is on the day CI runs" — code
      # nobody reviewed, executing with this workflow's token. The trailing
      # comment names the release that SHA was, so an upgrade stays a legible
      # one-line change rather than an opaque one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        # Full history: bin/verify greps every commit message for attribution
        # trailers, and a shallow clone has one commit's worth of history.
        with:
          fetch-depth: 0

      # `qmlformat -n` is the only QML check a machine without the Omarchy
      # shell can perform: it parses without resolving imports, so it never
      # sees `qs.Commons` and never needs to. The full `omarchy plugin
      # validate` runs on an Omarchy box, and bin/verify says plainly which
      # checks it skipped rather than implying all passed.
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq qt6-declarative-dev-tools shellcheck imagemagick

      - name: verify
        run: ./bin/verify
